name: Send Interest Rate Summary

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  send-interest-rate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Without the Gmail secrets, the Send step is skipped (with a warning)
      # instead of failing the run every time.
      HAS_GMAIL: ${{ secrets.GMAIL_ADDRESS != '' && secrets.GMAIL_APP_PASSWORD != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chrome-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browsers
        # Always run this, even on a cache hit: `playwright install` is
        # idempotent (skips the download if the correct version is already
        # present), and skipping it conditionally caused real failures in
        # practice when the cached browser build didn't match what the
        # installed playwright package expected.
        #
        # Installs both real Chrome (channel="chrome" - used first in
        # render_js_page for its more standard, less easily fingerprinted
        # browser signature versus Playwright's own bundled Chromium
        # build) and chromium (fallback if the chrome channel install
        # doesn't succeed in some future environment).
        run: |
          playwright install --with-deps chrome
          playwright install --with-deps chromium

      - name: Restore previous state
        continue-on-error: true
        run: |
          git fetch origin interest-rate-state:interest-rate-state 2>/dev/null || true
          git show interest-rate-state:last_rates.json > last_rates.json.tmp 2>/dev/null && mv last_rates.json.tmp last_rates.json || rm -f last_rates.json.tmp
          git show interest-rate-state:te_cache.json > te_cache.json.tmp 2>/dev/null && mv te_cache.json.tmp te_cache.json || rm -f te_cache.json.tmp

      - name: Generate email
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SEND_ONLY_ON_CHANGE: "false"
        run: python interest_rate_emailer.py generate

      - name: Warn that the Gmail secrets are missing
        if: env.HAS_GMAIL != 'true'
        run: echo "::warning::GMAIL_ADDRESS / GMAIL_APP_PASSWORD secrets are not set, so no email was sent. Add them in Settings -> Secrets and variables -> Actions."

      - name: Send email
        if: env.HAS_GMAIL == 'true'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          INTEREST_RATE_RECIPIENT: ${{ secrets.INTEREST_RATE_RECIPIENT }}
        run: python interest_rate_emailer.py send

      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan interest-rate-state-new
          git reset
          git add last_rates.json 2>/dev/null || true
          git add te_cache.json 2>/dev/null || true
          git commit -m "Update rate state" --allow-empty
          git branch -f interest-rate-state interest-rate-state-new
          git push origin interest-rate-state -f
